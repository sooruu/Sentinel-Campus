name: Campus checks

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-campus/package-lock.json
      - run: go test ./campus ./cmd/campus-demo
      - run: go vet ./...
      - run: npm ci
        working-directory: web-campus
      - run: npm run build
        working-directory: web-campus
